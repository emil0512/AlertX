apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alertx-hpa
  labels:
    app: alert-x
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alert-x
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
